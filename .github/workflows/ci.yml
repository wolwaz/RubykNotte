name: Ruby CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Ruby syntax and regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.5'

      - name: Check Ruby syntax
        run: |
          ruby -c tknote.rb
          # Syntax-check any module files that exist (lib/ or flat)
          for f in lib/*.rb *.rb; do
            [ -f "$f" ] && [ "$f" != "tknote.rb" ] && ruby -c "$f"
          done

      - name: Run regression tests
        run: ruby -I. -Ilib -Itest test/regression_test.rb
